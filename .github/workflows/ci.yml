name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Set up Node for the modeler UI
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/modeler/package-lock.json

      - name: Build the React TypeScript modeler UI
        working-directory: frontend/modeler
        run: |
          npm ci
          npm run build

      - name: Verify committed modeler assets
        run: git diff --exit-code -- lib/mxrb/web_ui

      - name: Check out pinned Mendix acceptance fixture
        run: |
          git clone --quiet https://github.com/ako/mxcli-sudoku.git /tmp/mxcli-sudoku
          git -C /tmp/mxcli-sudoku checkout --quiet 918af72e43ca8e1d61fb0c32ad13d8da94b944e2

      - name: Run strict test suite
        env:
          MXRB_COVERAGE: "1"
          MXRB_LINE_COVERAGE_MIN: "100"
          MXRB_BRANCH_COVERAGE_MIN: "100"
          MXRB_ACCEPTANCE_MPRS: /tmp/mxcli-sudoku/Sudoku/Sudoku.mpr
        run: bundle exec rspec

      - name: Run gradual Ruby quality gate
        run: bundle exec rubocop

  installed-gem:
    name: installed gem smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Build and install the packaged gem
        run: |
          gem build mxrb.gemspec
          gem install ./mxrb-*.gem --no-document
          mxrb --version

      - name: Create a Ruby application through the installed executable
        working-directory: /tmp
        run: |
          mxrb init InstalledGemSmoke --mode ruby
          test -f InstalledGemSmoke/.mxrb/ruby-app.json
          test -f InstalledGemSmoke/frontend/src/app/App.tsx

  ruby-frontend:
    name: generated Ruby TypeScript frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate and export a Ruby-first fixture
        run: |
          bundle exec ruby bin/mxrb generate spec/fixtures/flymetothemoon/project.rb /tmp/flymetothemoon.mpr
          bundle exec ruby bin/mxrb export /tmp/flymetothemoon.mpr /tmp/flymetothemoon-ruby --mode ruby --flymetothemoon

      - name: Run the complete application frontend gate
        working-directory: /tmp/flymetothemoon-ruby/frontend
        run: |
          npm ci
          npm run check

      - name: Compile the Ruby application back to Mendix
        run: |
          bundle exec ruby bin/mxrb portability /tmp/flymetothemoon-ruby --json
          bundle exec ruby bin/mxrb generate /tmp/flymetothemoon-ruby/project.rb /tmp/flymetothemoon-roundtrip.mpr
          bundle exec ruby bin/mxrb validate /tmp/flymetothemoon-roundtrip.mpr

  onnx:
    name: onnx
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITH: onnx
      MXRB_ONNX: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Restore pinned ONNX model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/informers
          key: informers-${{ runner.os }}-1.3.0-all-MiniLM-L6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41

      - name: Warm pinned ONNX model cache
        run: |
          for attempt in 1 2 3 4 5; do
            if bundle exec ruby -Ilib -e 'require "mxrb"; Mxrb::Semantic::OnnxEmbedder.new.dimension'; then
              exit 0
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Run real ONNX semantic-search smoke test
        env:
          INFORMERS_OFFLINE: "1"
        run: bundle exec rspec spec/semantic_search_spec.rb

  sqlite-vec:
    name: sqlite-vec
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile.sqlite-vec
      MXRB_SQLITE_VEC: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run real sqlite-vec semantic-search smoke test
        run: bundle exec rspec spec/semantic_search_spec.rb
