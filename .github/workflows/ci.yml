name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  performance:
    uses: ./.github/workflows/pipeline-performance.yml

  test:
    name: test
    needs: performance
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require a passing performance budget
        env:
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: test "$PERFORMANCE_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Set up Node for the modeler UI
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/modeler/package-lock.json

      - name: Set up Java for the action sidecar tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the React TypeScript modeler UI
        working-directory: frontend/modeler
        run: |
          npm ci
          npm run test:studio
          npm run test:build
          npm run build

      - name: Verify committed modeler assets
        run: git diff --exit-code -- lib/mxrb/web_ui

      - name: Check out pinned Mendix acceptance fixture
        run: |
          git clone --quiet https://github.com/ako/mxcli-sudoku.git /tmp/mxcli-sudoku
          git -C /tmp/mxcli-sudoku checkout --quiet 918af72e43ca8e1d61fb0c32ad13d8da94b944e2

      - name: Install the raster thumbnail worker
        timeout-minutes: 5
        run: |
          if command -v convert >/dev/null && convert -version >/dev/null; then
            exit 0
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y imagemagick
          convert -version

      - name: Enable the isolated Ruby preview sandbox
        timeout-minutes: 5
        run: |
          if ! command -v bwrap >/dev/null; then
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y bubblewrap
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --unshare-all --die-with-parent --ro-bind / / /usr/bin/true

      - name: Check out pinned imported-module fixture
        run: |
          git clone --quiet https://github.com/ako/ConnectorKitDemo.git /tmp/ConnectorKitDemo
          git -C /tmp/ConnectorKitDemo checkout --quiet 9eed61f1fb737d189a3b018ac7691c87569053de

      - name: Run strict test suite
        env:
          MXRB_IMAGEMAGICK: convert
          MXRB_COVERAGE: "1"
          MXRB_LINE_COVERAGE_MIN: "100"
          MXRB_BRANCH_COVERAGE_MIN: "100"
          MXRB_ACCEPTANCE_MPRS: /tmp/mxcli-sudoku/Sudoku/Sudoku.mpr
          MXRB_CONNECTOR_FIXTURE: /tmp/ConnectorKitDemo/ConnectorKitDemo.mpr
        run: bundle exec rspec

      - name: Run gradual Ruby quality gate
        run: bundle exec rubocop

      - name: Validate the portable Ruby application projection
        run: bundle exec ruby script/validate_ruby_app /tmp/mxcli-sudoku/Sudoku/Sudoku.mpr

  installed-gem:
    name: installed gem smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Build and install the packaged gem
        run: |
          gem build mxrb.gemspec
          gem install ./mxrb-*.gem --no-document
          mxrb --version

      - name: Create a Ruby application through the installed executable
        working-directory: /tmp
        run: |
          mxrb init InstalledGemSmoke --mode ruby
          test -f InstalledGemSmoke/.mxrb/ruby-app.json
          test -f InstalledGemSmoke/frontend/src/app/App.tsx

  browser:
    name: Chromium diagrams and presentation behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build modeler
        working-directory: frontend/modeler
        run: npm ci && npm run test:studio && npm run test:build && npm run build
      - name: Certify catalog and diagrams
        run: |
          bundle exec ruby bin/mxrb generate spec/fixtures/modeler_catalog/project.rb "${RUNNER_TEMP}/catalog.mpr"
          for scenario in modeler_catalog uml_diagrams; do
            bundle exec ruby script/browser_fixture_gate --kind modeler --source "${RUNNER_TEMP}/catalog.mpr" \
              --scenario "spec/fixtures/frontend_browser/${scenario}_flow.json" --output "tmp/browser-ci/$scenario"
          done
          bundle exec ruby script/browser_fixture_gate --kind domain --source "${RUNNER_TEMP}/catalog.mpr" \
            --scenario spec/fixtures/frontend_browser/domain_diagram_flow.json --output tmp/browser-ci/domain
      - name: Prepare the edited pinned Sudoku fixture
        run: |
          mkdir -p "${RUNNER_TEMP}/fixtures"
          git clone --quiet https://github.com/ako/mxcli-sudoku.git "${RUNNER_TEMP}/fixtures/sudoku"
          git -C "${RUNNER_TEMP}/fixtures/sudoku" checkout --quiet 918af72e43ca8e1d61fb0c32ad13d8da94b944e2
          bundle exec ruby script/certify_presentation_edits --plan spec/fixtures/presentation_edits/cases.json \
            --fixtures "${RUNNER_TEMP}/fixtures" --label mendix11 --output "${RUNNER_TEMP}/edits"
      - name: Certify edited Sudoku gameplay
        run: |
          app="${RUNNER_TEMP}/edits/mendix11/ruby"
          npm --prefix "$app/frontend" ci
          npm --prefix "$app/frontend" run build
          bundle exec ruby script/browser_fixture_gate --kind app --source "$app" \
            --scenario spec/fixtures/frontend_browser/presentation_edits_sudoku_flow.json --output tmp/browser-ci/sudoku
      - name: Certify scalar property edits and preserved gameplay
        run: |
          ln -s sudoku "${RUNNER_TEMP}/fixtures/mxcli-sudoku"
          bundle exec ruby script/certify_presentation_edits \
            --plan spec/fixtures/presentation_edits/property_cases.json \
            --fixtures "${RUNNER_TEMP}/fixtures" --label mendix11-properties \
            --output "${RUNNER_TEMP}/property-edits"
          app="${RUNNER_TEMP}/property-edits/mendix11-properties/ruby"
          npm --prefix "$app/frontend" ci
          npm --prefix "$app/frontend" run build
          bundle exec ruby script/browser_fixture_gate --kind app --source "$app" \
            --scenario spec/fixtures/frontend_browser/page_property_edits_flow.json \
            --output tmp/browser-ci/properties
      - name: Certify persistence and visible validation errors from an empty database
        env:
          MXRB_DATAGRID_PACKAGE: ${{ runner.temp }}/fixtures/sudoku/Sudoku/widgets/com.mendix.widget.web.Datagrid.mpk
        run: |
          bundle exec ruby bin/mxrb generate spec/fixtures/persistent_page_drafts/project.rb "${RUNNER_TEMP}/drafts/Drafts.mpr"
          bundle exec ruby bin/mxrb export "${RUNNER_TEMP}/drafts/Drafts.mpr" "${RUNNER_TEMP}/drafts/ruby" --mode ruby
          npm --prefix "${RUNNER_TEMP}/drafts/ruby/frontend" ci
          npm --prefix "${RUNNER_TEMP}/drafts/ruby/frontend" run build
          bundle exec ruby script/browser_fixture_gate --kind app --source "${RUNNER_TEMP}/drafts/ruby" \
            --scenario spec/fixtures/frontend_browser/presentation_persistence_flow.json --output tmp/browser-ci/persistence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-certification
          path: tmp/browser-ci
          retention-days: 14

  ruby-frontend:
    name: generated Ruby TypeScript frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate and export a Ruby-first fixture
        run: |
          bundle exec ruby bin/mxrb generate spec/fixtures/flymetothemoon/project.rb /tmp/flymetothemoon.mpr
          bundle exec ruby bin/mxrb export /tmp/flymetothemoon.mpr /tmp/flymetothemoon-ruby --mode ruby --flymetothemoon

      - name: Run the complete application frontend gate
        working-directory: /tmp/flymetothemoon-ruby/frontend
        run: |
          npm ci
          npm run check

      - name: Compile the Ruby application back to Mendix
        run: |
          bundle exec ruby bin/mxrb portability /tmp/flymetothemoon-ruby --json
          bundle exec ruby bin/mxrb generate /tmp/flymetothemoon-ruby/project.rb /tmp/flymetothemoon-roundtrip.mpr
          bundle exec ruby bin/mxrb validate /tmp/flymetothemoon-roundtrip.mpr

  onnx:
    name: onnx
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITH: onnx
      MXRB_ONNX: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Restore pinned ONNX model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/informers
          key: informers-${{ runner.os }}-1.3.0-all-MiniLM-L6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41

      - name: Warm pinned ONNX model cache
        run: |
          for attempt in 1 2 3 4 5; do
            if bundle exec ruby -Ilib -e 'require "mxrb"; Mxrb::Semantic::OnnxEmbedder.new.dimension'; then
              exit 0
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Run real ONNX semantic-search smoke test
        env:
          INFORMERS_OFFLINE: "1"
        run: bundle exec rspec spec/semantic_search_spec.rb

  sqlite-vec:
    name: sqlite-vec
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile.sqlite-vec
      MXRB_SQLITE_VEC: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run real sqlite-vec semantic-search smoke test
        run: bundle exec rspec spec/semantic_search_spec.rb
