<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MXRB · Domain Model</title>
  <style>
    :root { --chrome:#17191d; --chrome2:#22252b; --line:#3b414b; --muted:#9ba3af; --accent:#4ea1ff; --canvas:#f4f5f7; --card:#fff; --ink:#252930; }
    * { box-sizing:border-box } html,body,#app { width:100%;height:100%;margin:0;overflow:hidden }
    body { font:13px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--chrome);color:#e6e9ee;user-select:none }
    button,select,input { font:inherit }
    .shell { height:100%;display:grid;grid-template-rows:42px 38px 1fr 26px }
    .titlebar,.toolbar { display:flex;align-items:center;border-bottom:1px solid #30343b;background:var(--chrome);padding:0 10px;gap:7px }
    .brand { display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.01em }
    .logo { width:23px;height:23px;border-radius:5px;background:linear-gradient(145deg,#64b5ff,#3978db);display:grid;place-items:center;font-size:11px;color:white }
    .project { color:var(--muted);font-size:12px }.spacer{flex:1}.divider{width:1px;height:22px;background:#383c43;margin:0 3px}
    .tool { height:27px;border:1px solid transparent;border-radius:4px;background:transparent;color:#d5d9df;padding:0 9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer }
    .tool:hover { background:#2b2f36;border-color:#3c424b }.tool.primary{background:#2878d1;border-color:#398ce5;color:white}.tool.primary:hover{background:#3186df}
    .tool svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}.toolbar{background:var(--chrome2);padding-left:7px}.toolbar select{height:27px;background:#191b20;border:1px solid #3b4048;color:#ddd;border-radius:4px;padding:0 24px 0 8px}.zoom{min-width:48px;text-align:center;color:#bcc2cb;font-variant-numeric:tabular-nums}
    .workspace { min-height:0;display:grid;grid-template-columns:226px 1fr 250px }
    .sidebar,.inspector { background:#202329;border-right:1px solid #343840;min-width:0;overflow:auto }.inspector{border-right:0;border-left:1px solid #343840}
    .panel-title { height:34px;display:flex;align-items:center;padding:0 11px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#aeb5c0;border-bottom:1px solid #343840 }
    .search { margin:9px;width:calc(100% - 18px);height:29px;background:#17191d;border:1px solid #393e47;border-radius:4px;color:#e8ebef;padding:0 9px;outline:none }.search:focus{border-color:var(--accent)}
    .module { padding:7px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;color:#c7ccd4;border-left:3px solid transparent }.module:hover{background:#292d34}.module.active{background:#2b313a;border-left-color:var(--accent);color:white}.module .count{margin-left:auto;color:#858e9c;font-size:11px}.tree-dot{width:11px;height:11px;border:1px solid #7f8997;border-radius:2px;display:grid;place-items:center;font-size:9px}.module.active .tree-dot{background:#2878d1;border-color:#66adfa}.panel-actions{margin-left:auto;display:flex;gap:7px}.panel-action{border:0;background:transparent;color:#74b5ff;padding:0;cursor:pointer;font-size:10px}.panel-action:hover{text-decoration:underline}
    .viewport { position:relative;overflow:auto;background:var(--canvas);outline:none }.viewport.grid{background-image:linear-gradient(#dfe2e6 1px,transparent 1px),linear-gradient(90deg,#dfe2e6 1px,transparent 1px);background-size:20px 20px}
    #surface { position:relative;min-width:100%;min-height:100% } #stage { position:absolute;left:0;top:0;width:6000px;height:4000px;transform-origin:0 0 }
    #connections { position:absolute;inset:0;width:6000px;height:4000px;overflow:visible;pointer-events:none }.edge{fill:none;stroke:#798391;stroke-width:1.4;pointer-events:stroke;cursor:pointer}.edge:hover,.edge.selected{stroke:#1976d2;stroke-width:2.5}.edge-hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}.edge-label{font-size:10px;fill:#545d69;paint-order:stroke;stroke:#f4f5f7;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.edge-anchor{pointer-events:all;cursor:grab;stroke:#fff;stroke-width:2}.edge-anchor.source{fill:#ef8d22}.edge-anchor.target{fill:#1976d2}.edge-anchor:hover{r:8}.edge-anchor:active{cursor:grabbing}
    .entity { position:absolute;width:248px;background:var(--card);color:var(--ink);border:1px solid #8993a0;border-radius:4px;box-shadow:0 2px 5px #26313d22;overflow:hidden }.entity.selected{border-width:2px;box-shadow:0 0 0 2px #1976d233}.entity.match{box-shadow:0 0 0 3px #ffb30088}.entity.dim{opacity:.32}.entity.kind-entity{border-color:#4b8bc8}.entity.kind-dto{border-color:#d2a928}.entity.kind-oql_view{border-color:#49a566}
    .entity-head { height:34px;border-bottom:1px solid #c6ccd3;display:flex;align-items:center;padding:0 9px;gap:8px;cursor:grab;font-weight:650 }.kind-entity .entity-head{background:linear-gradient(#e4f1ff,#cfe5fb)}.kind-dto .entity-head{background:linear-gradient(#fff8d8,#f8e9a3)}.kind-oql_view .entity-head{background:linear-gradient(#e5f8e9,#ccebd4)}.entity-head:active{cursor:grabbing}.kind{width:19px;height:17px;border:1px solid currentColor;border-radius:3px;display:grid;place-items:center;font-size:8px}.kind-entity .kind{color:#236ba8}.kind-dto .kind{color:#8c6b00}.kind-oql_view .kind{color:#237841}.entity-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qualified{margin-left:auto;color:#67717d;font-size:9px}.attrs{padding:3px 0}.attr{height:23px;display:grid;grid-template-columns:17px 1fr auto;align-items:center;padding:0 8px;gap:4px;border-bottom:1px solid #f0f1f3}.attr:last-child{border:0}.attr-icon{font-size:9px;color:#b27a12}.attr-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attr-type{color:#77818d;font-size:10px}.dto{font-style:italic;color:#6e7782;padding:7px 9px}.legend{display:flex;align-items:center;gap:10px;color:#adb5c0;font-size:11px}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:9px;height:9px;border-radius:2px}.legend .entity-color{background:#68a8e3}.legend .dto-color{background:#e2c044}.legend .oql-color{background:#62ba78}
    .handle { position:absolute;width:10px;height:10px;background:#fff;border:2px solid #1976d2;border-radius:50%;z-index:4;display:none}.entity.selected .handle{display:block}.handle.north{top:-6px;left:calc(50% - 5px)}.handle.east{right:-6px;top:calc(50% - 5px)}.handle.south{bottom:-6px;left:calc(50% - 5px)}.handle.west{left:-6px;top:calc(50% - 5px)}
    .empty { color:#8d96a3;padding:18px 12px;line-height:1.55 }.section{padding:11px;border-bottom:1px solid #343840}.section h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9da6b3;margin:0 0 10px}.field{margin:9px 0}.field label{display:block;color:#aeb5bf;font-size:11px;margin-bottom:5px}.field select{width:100%;height:29px;background:#17191d;border:1px solid #3d424b;color:#e3e7ed;border-radius:4px;padding:0 7px}.meta{color:#c8cdd5;line-height:1.5;word-break:break-word}.meta small{display:block;color:#848d9a}.hint{color:#8d96a3;font-size:11px;line-height:1.5}
    .statusbar{display:flex;align-items:center;gap:14px;background:#1b1d21;border-top:1px solid #30343b;padding:0 9px;color:#8f98a5;font-size:11px}.statusbar .ok{color:#64c68a}.toast{position:fixed;right:18px;bottom:40px;background:#252a31;border:1px solid #3f4650;padding:10px 13px;border-radius:5px;box-shadow:0 8px 25px #0006;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}.toast.error{border-color:#b84b4b;color:#ffb0b0}
  </style>
</head>
<body><div id="app"><div class="shell">
  <div class="titlebar"><div class="brand"><div class="logo">MX</div><span>Domain Model</span><span class="project" id="project"></span></div><div class="spacer"></div><button class="tool" id="save"><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5zM8 4v6h8V4M8 20v-7h8v7"/></svg>Salvar layout no MPR</button><button class="tool primary" id="png"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>Exportar PNG</button></div>
  <div class="toolbar"><button class="tool" id="arrange">Auto-organizar</button><button class="tool" id="fit">Ajustar à tela</button><div class="divider"></div><button class="tool" id="zoomOut">−</button><span class="zoom" id="zoom">100%</span><button class="tool" id="zoomIn">+</button><div class="divider"></div><button class="tool" id="toggleGrid">Grade</button><select id="attributes"><option value="all">Atributos: todos</option><option value="keys">Apenas chaves</option><option value="none">Sem atributos</option></select><select id="routing"><option value="orthogonal">Rotas ortogonais</option><option value="shortest">Rotas curtas</option></select><div class="spacer"></div><div class="legend"><span><i class="entity-color"></i>Entidade</span><span><i class="dto-color"></i>DTO</span><span><i class="oql-color"></i>OQL view</span></div></div>
  <div class="workspace"><aside class="sidebar"><div class="panel-title"><span>Módulos</span><span class="panel-actions"><button class="panel-action" id="selectAll">Todos</button><button class="panel-action" id="selectNone">Limpar</button></span></div><input class="search" id="search" placeholder="Buscar entidade ou atributo…"><div id="modules"></div></aside><main class="viewport grid" id="viewport" tabindex="0"><div id="surface"><div id="stage"><svg id="connections"></svg><div id="entities"></div></div></div></main><aside class="inspector"><div class="panel-title">Propriedades</div><div id="inspector" class="empty">Selecione uma entidade ou relacionamento.</div></aside></div>
  <div class="statusbar"><span class="ok">● conectado</span><span id="stats"></span><span id="dirty">Layout sem alterações</span><span class="spacer"></span><span id="output"></span></div>
</div><div class="toast" id="toast"></div></div>
<script>
(() => {
  const CARD_W=248, HEAD_H=34, ROW_H=23, WORLD_W=6000, WORLD_H=4000;
  const state={data:null,modules:new Set(),zoom:1,dirty:false,selected:null,attrMode:'all',routing:'orthogonal'};
  const $=id=>document.getElementById(id), viewport=$('viewport'), stage=$('stage'), surface=$('surface');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const visibleAttrs=e=>state.attrMode==='none'?[]:state.attrMode==='keys'?e.attributes.filter(a=>a.key):e.attributes;
  const cardH=e=>HEAD_H+(visibleAttrs(e).length?visibleAttrs(e).length*ROW_H+6:30);
  const visibleModules=()=>state.data.modules.filter(module=>state.modules.has(module.name));
  const visibleEntities=()=>visibleModules().flatMap(module=>module.entities);
  const byQName=()=>Object.fromEntries(visibleEntities().map(entity=>[entity.qualified_name,entity]));
  const findEntity=id=>state.data.modules.flatMap(module=>module.entities).find(entity=>entity.id===id);
  const findAssociation=id=>state.data.modules.flatMap(module=>module.associations).find(association=>association.id===id);
  const visibleAssociations=()=>{const names=new Set(visibleEntities().map(entity=>entity.qualified_name)),seen=new Set();return visibleModules().flatMap(module=>module.associations).filter(association=>names.has(association.from)&&names.has(association.to)&&!seen.has(association.id)&&seen.add(association.id))};
  const kindLabel=entity=>entity.kind==='oql_view'?'OQL view':entity.kind==='dto'?'DTO / non-persistent':'Entidade persistente';
  const kindCode=entity=>entity.kind==='oql_view'?'OQL':entity.kind==='dto'?'DTO':'E';
  const anchorPoint=(e,side)=>{const h=cardH(e);return side==='north'?[e.x+CARD_W/2,e.y]:side==='east'?[e.x+CARD_W,e.y+h/2]:side==='south'?[e.x+CARD_W/2,e.y+h]:[e.x,e.y+h/2]};
  const pathFor=(a,entities)=>{const from=entities[a.from],to=entities[a.to];if(!from||!to)return null;const [x1,y1]=anchorPoint(from,a.source_anchor),[x2,y2]=anchorPoint(to,a.target_anchor);if(state.routing==='shortest')return {d:`M${x1},${y1} L${x2},${y2}`,x:(x1+x2)/2,y:(y1+y2)/2};const vertical=['north','south'].includes(a.source_anchor);let d;if(vertical){const mid=(y1+y2)/2;d=`M${x1},${y1} L${x1},${mid} L${x2},${mid} L${x2},${y2}`}else{const mid=(x1+x2)/2;d=`M${x1},${y1} L${mid},${y1} L${mid},${y2} L${x2},${y2}`}return {d,x:(x1+x2)/2,y:(y1+y2)/2}};
  function setDirty(value=true){state.dirty=value;$('dirty').textContent=value?'● Alterações não salvas':'Layout salvo';$('dirty').style.color=value?'#e8b55c':''}
  function toast(message,error=false){const el=$('toast');el.textContent=message;el.className=`toast show${error?' error':''}`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className='toast',2600)}
  function setZoom(value){state.zoom=Math.max(.25,Math.min(2,value));stage.style.transform=`scale(${state.zoom})`;surface.style.width=`${WORLD_W*state.zoom}px`;surface.style.height=`${WORLD_H*state.zoom}px`;$('zoom').textContent=`${Math.round(state.zoom*100)}%`}
  function renderModules(){
    $('modules').innerHTML=state.data.modules.map(module=>{
      const active=state.modules.has(module.name);
      return `<div class="module ${active?'active':''}" data-module="${esc(module.name)}"><span class="tree-dot">${active?'✓':''}</span><span>${esc(module.name)}</span><span class="count">${module.entities.length}</span></div>`;
    }).join('');
    document.querySelectorAll('.module').forEach(element=>element.onclick=()=>{
      const name=element.dataset.module;
      const adding=!state.modules.has(name);
      if(adding)state.modules.add(name);else state.modules.delete(name);
      state.selected=null;
      if(adding&&state.modules.size>1)arrange(false);else{render();setTimeout(fit,0)}
    });
  }
  function render(){
    renderModules();
    const entities=visibleEntities(),associations=visibleAssociations(),q=$('search').value.trim().toLowerCase();
    $('entities').innerHTML=entities.map(entity=>{
      const attrs=visibleAttrs(entity),match=!q||entity.name.toLowerCase().includes(q)||entity.module.toLowerCase().includes(q)||entity.attributes.some(attribute=>attribute.name.toLowerCase().includes(q));
      return `<article class="entity kind-${entity.kind} ${state.selected?.kind==='entity'&&state.selected.id===entity.id?'selected':''} ${q?(match?'match':'dim'):''}" data-id="${entity.id}" style="left:${entity.x}px;top:${entity.y}px"><div class="entity-head"><span class="kind">${kindCode(entity)}</span><span class="entity-name">${esc(entity.name)}</span><span class="qualified">${esc(entity.module)}</span></div>${attrs.length?`<div class="attrs">${attrs.map(attribute=>`<div class="attr"><span class="attr-icon">${attribute.key?'◆':attribute.required?'●':'○'}</span><span class="attr-name">${esc(attribute.name)}</span><span class="attr-type">${esc(attribute.type)}</span></div>`).join('')}</div>`:'<div class="dto">Nenhum atributo visível</div>'}<i class="handle north"></i><i class="handle east"></i><i class="handle south"></i><i class="handle west"></i></article>`;
    }).join('');
    bindCards();drawConnections();renderInspector();
    $('stats').textContent=`${visibleModules().length} módulo(s) · ${entities.length} entidades · ${associations.length} relacionamentos`;
  }
  function bindCards(){
    document.querySelectorAll('.entity').forEach(card=>{
      const entity=findEntity(card.dataset.id);
      card.onclick=event=>{event.stopPropagation();state.selected={kind:'entity',id:entity.id};render()};
      card.querySelector('.entity-head').onpointerdown=event=>{
        event.preventDefault();event.stopPropagation();state.selected={kind:'entity',id:entity.id};card.setPointerCapture(event.pointerId);
        const sx=event.clientX,sy=event.clientY,ox=entity.x,oy=entity.y;
        card.onpointermove=move=>{entity.x=Math.round((ox+(move.clientX-sx)/state.zoom)/10)*10;entity.y=Math.round((oy+(move.clientY-sy)/state.zoom)/10)*10;card.style.left=`${entity.x}px`;card.style.top=`${entity.y}px`;drawConnections();setDirty()};
        card.onpointerup=()=>{card.onpointermove=null;renderInspector()};
      };
    });
  }
  function drawConnections(){
    const entities=byQName(),selected=state.selected?.kind==='association'?state.selected.id:null;
    let svg='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66717e"/></marker></defs>';
    visibleAssociations().forEach(association=>{
      const path=pathFor(association,entities);if(!path)return;
      svg+=`<path class="edge-hit" data-edge="${association.id}" d="${path.d}"/><path class="edge ${selected===association.id?'selected':''}" data-edge="${association.id}" d="${path.d}" marker-end="url(#arrow)"/><text class="edge-label" x="${path.x+5}" y="${path.y-6}">${esc(association.name)}</text>`;
      if(selected===association.id){
        const source=anchorPoint(entities[association.from],association.source_anchor),target=anchorPoint(entities[association.to],association.target_anchor);
        svg+=`<circle class="edge-anchor source" data-edge="${association.id}" data-side="source" cx="${source[0]}" cy="${source[1]}" r="6"><title>Arraste a origem</title></circle><circle class="edge-anchor target" data-edge="${association.id}" data-side="target" cx="${target[0]}" cy="${target[1]}" r="6"><title>Arraste a ponta da seta</title></circle>`;
      }
    });
    $('connections').innerHTML=svg;
    document.querySelectorAll('[data-edge]').forEach(element=>element.onclick=event=>{event.stopPropagation();state.selected={kind:'association',id:element.dataset.edge};render()});
    document.querySelectorAll('.edge-anchor').forEach(element=>element.onpointerdown=event=>startAnchorDrag(event,findAssociation(element.dataset.edge),element.dataset.side));
  }
  function startAnchorDrag(event,association,side){
    event.preventDefault();event.stopPropagation();state.selected={kind:'association',id:association.id};
    const entity=byQName()[side==='source'?association.from:association.to],property=`${side}_anchor`;
    const move=pointer=>{
      const rect=stage.getBoundingClientRect(),x=(pointer.clientX-rect.left)/state.zoom,y=(pointer.clientY-rect.top)/state.zoom;
      association[property]=['north','east','south','west'].map(anchor=>({anchor,point:anchorPoint(entity,anchor)})).sort((a,b)=>Math.hypot(a.point[0]-x,a.point[1]-y)-Math.hypot(b.point[0]-x,b.point[1]-y))[0].anchor;
      association.anchor_dirty=true;setDirty();drawConnections();renderInspector();
    };
    const stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop)};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop,{once:true});move(event);
  }
  function renderInspector(){
    const target=$('inspector');
    if(!state.selected){target.className='empty';target.innerHTML='Selecione uma entidade ou relacionamento.<br><br>Marque vários módulos para ver relações entre eles. Arraste o cabeçalho dos cards para organizar.';return}
    target.className='';
    if(state.selected.kind==='entity'){
      const entity=findEntity(state.selected.id);if(!entity){state.selected=null;renderInspector();return}
      target.innerHTML=`<div class="section"><h3>${esc(kindLabel(entity))}</h3><div class="meta"><strong>${esc(entity.name)}</strong><small>${esc(entity.qualified_name)}</small><small>Módulo ${esc(entity.module)}</small></div></div><div class="section"><h3>Posição</h3><div class="meta">X ${entity.x} · Y ${entity.y}</div><p class="hint">A posição é gravada no Domain Model do MPR.</p></div>`;return;
    }
    const association=findAssociation(state.selected.id);if(!association){state.selected=null;renderInspector();return}
    const storage=association.anchor_storage==='native'?'campos nativos do Mendix':'metadados visuais seguros do MXRB';
    target.innerHTML=`<div class="section"><h3>Relacionamento${association.cross_module?' cross-module':''}</h3><div class="meta"><strong>${esc(association.name)}</strong><small>${esc(association.from)} → ${esc(association.to)}</small><small>${esc(association.type)} · owner ${esc(association.owner)}</small></div></div><div class="section"><h3>Pontos de conexão</h3><div class="field"><label>Origem</label><select id="sourceAnchor">${anchorOptions(association.source_anchor)}</select></div><div class="field"><label>Ponta da seta</label><select id="targetAnchor">${anchorOptions(association.target_anchor)}</select></div><p class="hint">Arraste os pontos laranja e azul diretamente no diagrama ou use os campos acima. Persistência: ${storage}.</p></div>`;
    ['source','target'].forEach(side=>{$(`${side}Anchor`).onchange=event=>{association[`${side}_anchor`]=event.target.value;association.anchor_dirty=true;setDirty();drawConnections()}});
  }
  function anchorOptions(selected){return [['north','Superior'],['east','Direita'],['south','Inferior'],['west','Esquerda']].map(([v,n])=>`<option value="${v}" ${v===selected?'selected':''}>${n}</option>`).join('')}
  function applySearch(){render()}
  function arrange(markDirty=true){
    const modules=visibleModules(),moduleCols=Math.max(1,Math.ceil(Math.sqrt(modules.length)));
    modules.forEach((module,moduleIndex)=>{const entityCols=Math.max(1,Math.ceil(Math.sqrt(module.entities.length))),baseX=100+(moduleIndex%moduleCols)*1050,baseY=90+Math.floor(moduleIndex/moduleCols)*850;module.entities.forEach((entity,index)=>{entity.x=baseX+(index%entityCols)*300;entity.y=baseY+Math.floor(index/entityCols)*230})});
    if(markDirty)setDirty();render();fit();
  }
  function bounds(){const entities=visibleEntities();if(!entities.length)return{x:0,y:0,w:1000,h:700};const minX=Math.min(...entities.map(entity=>entity.x)),minY=Math.min(...entities.map(entity=>entity.y)),maxX=Math.max(...entities.map(entity=>entity.x+CARD_W)),maxY=Math.max(...entities.map(entity=>entity.y+cardH(entity)));return{x:minX,y:minY,w:maxX-minX,h:maxY-minY}}
  function fit(){const b=bounds(),z=Math.min(1.3,(viewport.clientWidth-100)/b.w,(viewport.clientHeight-100)/b.h);setZoom(z);viewport.scrollLeft=Math.max(0,(b.x-45)*z);viewport.scrollTop=Math.max(0,(b.y-45)*z)}
  async function save(){
    const payload={modules:state.data.modules.map(module=>({name:module.name,entities:module.entities.map(entity=>({id:entity.id,x:entity.x,y:entity.y})),associations:module.associations.filter(association=>association.anchor_storage==='native'||association.anchor_dirty).map(association=>({id:association.id,source_anchor:association.source_anchor,target_anchor:association.target_anchor}))}))};
