<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MXRB UML</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--ink:#17202a;--muted:#65717e;--line:#d8dee5;--brand:#2563a6;--brand2:#174875;--danger:#a22626}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr}
    header{display:flex;align-items:center;gap:18px;padding:12px 18px;background:#13283b;color:#fff;box-shadow:0 1px 5px #0004}header h1{font-size:17px;margin:0;letter-spacing:.03em}header span{color:#b9cada}
    main{display:grid;grid-template-columns:310px 1fr;min-height:0}.sidebar{padding:18px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}.canvas{overflow:auto;padding:22px;display:grid;place-items:start center}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:18px}.tab{border:1px solid var(--line);background:#edf1f5;padding:8px 4px;border-radius:5px;cursor:pointer}.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
    label{display:block;font-weight:650;margin:13px 0 5px}input,select{width:100%;padding:8px;border:1px solid #b9c3cd;border-radius:5px;background:#fff}small{display:block;color:var(--muted);margin-top:5px}
    .actions{display:grid;gap:8px;margin-top:18px}button{font:inherit}.primary,.secondary{padding:9px 12px;border-radius:5px;cursor:pointer}.primary{border:1px solid var(--brand2);background:var(--brand);color:#fff}.secondary{border:1px solid #aab5c0;background:#fff;color:var(--ink)}
    #diagram{min-width:680px;min-height:420px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px;box-shadow:0 4px 18px #1c304412}#diagram svg{max-width:none!important;height:auto}.error{color:var(--danger);white-space:pre-wrap}.hidden{display:none}
    @media(max-width:850px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}#diagram{min-width:100%}}
  </style>
</head>
<body>
  <header><h1>MXRB UML</h1><span>Class · Activity · Sequence</span></header>
  <main>
    <aside class="sidebar">
      <div class="tabs">
        <button class="tab active" data-kind="class">Class</button>
        <button class="tab" data-kind="activity">Activity</button>
        <button class="tab" data-kind="sequence">Sequence</button>
      </div>
      <section id="class-controls">
        <label for="modules">Módulos</label>
        <input id="modules" list="module-list" placeholder="Sales,Billing">
        <datalist id="module-list"></datalist>
        <small>Vazio inclui todos; separe vários por vírgula.</small>
      </section>
      <section id="activity-controls" class="hidden">
        <label for="microflow">Microflow</label>
        <input id="microflow" list="microflow-list" placeholder="Sales.CreateOrder">
        <datalist id="microflow-list"></datalist>
      </section>
      <section id="sequence-controls" class="hidden">
        <label for="sequence-mode">Origem</label>
        <select id="sequence-mode"><option value="root">Microflow raiz</option><option value="module">Módulo</option></select>
        <label for="sequence-value">Nome qualificado</label>
        <input id="sequence-value" placeholder="Sales.CreateOrder">
        <label for="depth">Profundidade</label>
        <input id="depth" type="number" min="0" value="2">
      </section>
      <div class="actions">
        <button id="render" class="primary">Renderizar diagrama</button>
        <button id="mermaid" class="secondary">Exportar Mermaid</button>
        <button id="plantuml" class="secondary">Exportar PlantUML</button>
      </div>
    </aside>
    <div class="canvas"><div id="diagram">Carregando…</div></div>
  </main>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'neutral',flowchart:{useMaxWidth:false}});
    const state={kind:'class',payload:null,renderId:0},$=id=>document.getElementById(id);
    document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{state.kind=button.dataset.kind;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));['class','activity','sequence'].forEach(kind=>$(kind+'-controls').classList.toggle('hidden',kind!==state.kind))});
    function endpoint(){if(state.kind==='class')return '/api/class?modules='+encodeURIComponent($('modules').value);if(state.kind==='activity')return '/api/activity?microflow='+encodeURIComponent($('microflow').value);const mode=$('sequence-mode').value,value=encodeURIComponent($('sequence-value').value),depth=encodeURIComponent($('depth').value);return `/api/sequence?${mode}=${value}&depth=${depth}`}
    async function render(){const box=$('diagram');box.textContent='Renderizando…';try{const response=await fetch(endpoint()),payload=await response.json();if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);state.payload=payload;const result=await mermaid.render(`mxrb-uml-${++state.renderId}`,payload.mermaid);box.innerHTML=result.svg;result.bindFunctions?.(box)}catch(error){box.innerHTML='';const pre=document.createElement('pre');pre.className='error';pre.textContent=error.message;box.appendChild(pre)}}
    function download(format,extension){if(!state.payload)return;const blob=new Blob([state.payload[format]],{type:'text/plain;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`mxrb-${state.kind}.${extension}`;link.click();URL.revokeObjectURL(link.href)}
    $('render').onclick=render;$('mermaid').onclick=()=>download('mermaid','mmd');$('plantuml').onclick=()=>download('plantuml','puml');
    $('sequence-mode').onchange=()=>{$('sequence-value').placeholder=$('sequence-mode').value==='root'?'Sales.CreateOrder':'Sales';$('depth').disabled=$('sequence-mode').value==='module'};
    fetch('/api/catalog').then(response=>response.json()).then(catalog=>{catalog.modules.forEach(name=>{const option=document.createElement('option');option.value=name;$('module-list').appendChild(option)});catalog.microflows.forEach(name=>{const option=document.createElement('option');option.value=name;$('microflow-list').appendChild(option)});if(catalog.microflows[0]){$('microflow').value=catalog.microflows[0];$('sequence-value').value=catalog.microflows[0]}}).finally(render);
  </script>
</body>
</html>
